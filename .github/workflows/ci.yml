name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned calibration Python contract
        run: .xgc2/scripts/prepare_calibration_contract.sh "$RUNNER_TEMP/calibration-contract"
      - name: Validate source and product contracts
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -e PYTHONPYCACHEPREFIX=/tmp/xgc2-gazebo-sim-camera-pycache \
            -v "$GITHUB_WORKSPACE:/workspace/repo:ro" \
            -v "$RUNNER_TEMP/calibration-contract:/workspace/calibration-contract:ro" \
            ghcr.io/xgc-team/xgc2-images/xgc2-build-focal-full-noetic:1.0.0 bash -lc '
              set -euo pipefail
              install -d -m 0755 /etc/apt/keyrings
              curl -fsSL --retry 5 https://xgc2.apt.xiaokang.ink/xgc2-archive-keyring.gpg \
                -o /etc/apt/keyrings/xgc2-archive-keyring.gpg
              echo "deb [signed-by=/etc/apt/keyrings/xgc2-archive-keyring.gpg] https://xgc2.apt.xiaokang.ink focal main" \
                > /etc/apt/sources.list.d/xgc2.list
              apt-get update
              apt-get install -y --no-install-recommends ros-noetic-xgc2-camera-calibration
              source /opt/ros/noetic/setup.bash
              export PYTHONPATH="/workspace/calibration-contract/xgc_camera_calibration/src:${PYTHONPATH:-}"
              cd /workspace/repo
              .xgc2/scripts/check_package_compliance.sh
            '
  build-debs:
    needs: compliance
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned calibration Python contract
        run: .xgc2/scripts/prepare_calibration_contract.sh "$RUNNER_TEMP/calibration-contract"
      - name: Build, test, and package Debian artifact
        run: |
          install -d "$GITHUB_WORKSPACE/.ci/build-manifests"
          .xgc2/scripts/build_debs_in_docker.sh \
            --work-dir "$RUNNER_TEMP/xgc2-gazebo-sim-camera-${{ matrix.arch }}" \
            --output-dir "$GITHUB_WORKSPACE/debs" \
            --calibration-contract-source "$RUNNER_TEMP/calibration-contract" \
            --skip-install-check
      - name: Create trusted build manifest
        run: |
          version="$(awk -F': *' '/^version:/ {print $2; exit}' .xgc2/product.yml)"
          python3 .xgc2/scripts/xgc2_artifact_manifest.py build \
            --deb-dir debs --output-dir .ci/build-manifests \
            --product xgc2-gazebo-sim-camera --product-version "$version" \
            --distribution focal --architecture "${{ matrix.arch }}" \
            --source-sha "$GITHUB_SHA" --ci-run-id "$GITHUB_RUN_ID" \
            --ci-workflow "$GITHUB_WORKFLOW" --ci-workflow-ref "$GITHUB_WORKFLOW_REF"
      - uses: actions/upload-artifact@v4
        with:
          name: xgc2-gazebo-sim-camera-debs-${{ matrix.arch }}
          path: |
            debs/*.deb
            .ci/build-manifests/*.json
          include-hidden-files: true
          retention-days: 14
